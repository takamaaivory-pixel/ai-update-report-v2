name: V2 Weekly AI Update Report

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate structured report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            echo "Gemini report generation attempt ${attempt}/5"
            output=$(python -u scripts/generate_report.py 2>&1)
            status=$?
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! printf '%s\n' "$output" | grep -q 'HTTP Error 503: Service Unavailable'; then
              echo 'Non-503 error: failing without retry.'
              exit "$status"
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Gemini HTTP 503 persisted after 5 attempts.'
              exit "$status"
            fi
            wait=$((30 * 2 ** (attempt - 1)))
            echo "Gemini HTTP 503 retry ${attempt}/5; waiting ${wait}s."
            sleep "$wait"
          done

      - name: Normalize audit state
        run: python -u scripts/normalize_audit_state.py

      - name: Generate maturity dashboard
        run: python -u scripts/generate_dashboard.py

      - name: Validate V2 output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          dashboard = Path('dashboard.html').read_text(encoding='utf-8')
          state = json.loads(Path('data/audit_process_state.json').read_text(encoding='utf-8'))
          required = [
              '今週の重要アップデートTOP5','ChatGPT / OpenAI','Gemini / Google',
              'Claude / Anthropic','Microsoft Copilot','内部監査への示唆',
              '内部監査プロセスの高度化への有用性','今後ウォッチすべき事項','情報源',
              '① リスク評価','② 監査計画','③ 資料収集','④ 分析・検証',
              '⑤ 指摘・原因分析','⑥ 報告','⑦ フォローアップ'
          ]
          missing = [x for x in required if x not in html]
          if set(state['processes']) != set(map(str, range(1,8))):
              raise SystemExit('Audit process state must contain exactly seven stages.')
          if len(state.get('history', [])) < 1:
              raise SystemExit('History was not recorded.')
          if missing:
              raise SystemExit('Missing HTML sections: ' + ', '.join(missing))
          dates = [x.get('date') for x in state.get('history', [])]
          if len(dates) != len(set(dates)):
              raise SystemExit('History contains duplicate dates.')
          for token in ['7工程の成熟度推移', '成熟度の判定基準', '現在地']:
              if token not in dashboard:
                  raise SystemExit('Missing dashboard section: ' + token)
          print('V2 validation passed.')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html dashboard.html data/audit_process_state.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Update V2 AI audit intelligence report'
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
